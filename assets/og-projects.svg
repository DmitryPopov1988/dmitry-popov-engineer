<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="120" y="80" width="960" height="480" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="120" y="80" width="960" height="44" rx="16" fill="#21262d"/>
  <rect x="120" y="108" width="960" height="16" fill="#21262d"/>
  <circle cx="150" cy="102" r="7" fill="#ff5f57"/>
  <circle cx="174" cy="102" r="7" fill="#ffbd2e"/>
  <circle cx="198" cy="102" r="7" fill="#28c840"/>
  <text x="600" y="107" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#8b949e">dmitry@popov.engineer &#8212; zsh &#8212; projects</text>

  <!-- content -->
  <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="22">
    <text x="160" y="180" fill="#7ee787">&gt; ls projects/</text>
    <text x="160" y="212" fill="#79c0ff">customer-web-apps/ energy-microservices/ banking-core/ this-site/</text>

    <text x="160" y="272" fill="#7ee787">&gt; cat projects/customer-web-apps/README.md</text>
    <text x="160" y="304" fill="#d2a8ff">customer-web-apps<tspan fill="#8b949e">  &#8212; four customer-facing web apps</tspan></text>
    <text x="180" y="336" fill="#c9d1d9"><tspan fill="#79c0ff">scale</tspan>:  ~10M monthly online users</text>
    <text x="180" y="364" fill="#c9d1d9"><tspan fill="#79c0ff">stack</tspan>:  TypeScript, Node.js, Jest, Playwright</text>

    <text x="160" y="424" fill="#7ee787">&gt; cat projects/energy-microservices/README.md</text>
    <text x="160" y="456" fill="#d2a8ff">energy-microservices<tspan fill="#8b949e">  &#8212; the platform behind customer journeys</tspan></text>
    <text x="180" y="488" fill="#c9d1d9"><tspan fill="#79c0ff">scale</tspan>:  customer base of 2M+</text>
    <text x="180" y="516" fill="#c9d1d9"><tspan fill="#79c0ff">stack</tspan>:  Java, Spring Boot, PostgreSQL, Cassandra, K8s</text>
  </g>

  <text x="600" y="605" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#8b949e">dmitry.popov.engineer/projects</text>
